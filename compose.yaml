# ABOUTME: Loads the bundled AppArmor policy and runs the confined vmobs appliance.
# ABOUTME: Start with docker compose up -d; no host configuration is installed.
#
# The loader changes kernel policy through securityfs before the appliance starts.
# Its policy-management capability belongs only to this short-lived service.

services:
  apparmor:
    image: ${VMOBS_IMAGE:-ghcr.io/2389-research/observatory:latest}
    entrypoint: ["/usr/sbin/apparmor_parser"]
    command: ["--replace", "--skip-cache", "/etc/apparmor.d/vmobs-jailer"]
    cap_drop:
      - ALL
    cap_add:
      - MAC_ADMIN
    security_opt:
      - apparmor=unconfined
    read_only: true
    network_mode: none
    volumes:
      - type: bind
        source: /sys/kernel/security
        target: /sys/kernel/security
        read_only: false
        bind:
          create_host_path: false
    restart: "no"

  vmobs:
    depends_on:
      apparmor:
        condition: service_completed_successfully
    container_name: ${VMOBS_CONTAINER_NAME:-vmobs}
    image: ${VMOBS_IMAGE:-ghcr.io/2389-research/observatory:latest}

    # Built from this checkout when the image is not present. The build needs the
    # guest kernel and root image at images/dist/ -- `scripts/fetch-guest-images`
    # downloads them against runtime.lock.json. A published image already carries
    # them and needs neither the checkout nor the fetch.
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # The script derives this from git; compose cannot, so an unset variable
        # stamps the image "unknown" rather than guessing at a revision.
        SOURCE_REVISION: ${VMOBS_SOURCE_REVISION:-unknown}

    # The root-owned ledger survives container replacement. Host PIDs keep its
    # process identities meaningful across starts; host PID 1 reaps jailed VMMs.
    pid: host

    # The API binds loopback (server.mode: loopback_only), so the container's
    # loopback has to be the host's for anyone to reach it.
    network_mode: host

    # docs/design/container-boundary.md §5 exactly: SYS_ADMIN for setns and the
    # jailer's mounts, NET_ADMIN plus /dev/net/tun for tap and veth.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    devices:
      - /dev/kvm
      - /dev/net/tun

    # AppArmor names the policy loaded above; seccomp resolves against this
    # project directory. Both are required: AppArmor bounds mount targets and
    # seccomp bounds syscalls, including pivot_root.
    # VMOBS_APPARMOR_PROFILE=unconfined explicitly drops mount confinement.
    security_opt:
      - apparmor=${VMOBS_APPARMOR_PROFILE:-vmobs-jailer}
      - seccomp=./deploy/seccomp/vmobs-jailer.json

    # privd binds its socket under /run/vmobs; the image creates that directory in
    # a layer, and the tmpfs keeps the socket out of the image's filesystem.
    tmpfs:
      - /run:mode=0755

    volumes:
      - vmobs-state:/var/lib/vmobs
      - vmobs-runtime:/srv/vmobs

    # A crashed appliance stays down and keeps its logs. Restarting it would
    # reconcile against half-torn-down VMs before anyone had read why it fell over.
    restart: "no"
    # Leave room for the daemon's bounded 85s drain before Docker sends SIGKILL.
    stop_grace_period: 90s

# Named to match scripts/vmobs-container, so the two start the same appliance and
# `docker volume rm vmobs-state vmobs-runtime` means the same thing either way.
# Without `name:` compose would prefix the project directory onto both.
volumes:
  vmobs-state:
    name: ${VMOBS_STATE_VOLUME:-vmobs-state}
  vmobs-runtime:
    name: ${VMOBS_RUNTIME_VOLUME:-vmobs-runtime}
