# ABOUTME: Runs the vmobs appliance under the measured container boundary.
# ABOUTME: Two commands to install: deploy/install-apparmor.sh, then compose up.
#
#   sudo sh deploy/install-apparmor.sh    # once per host, loads the AppArmor profile
#   docker compose up -d
#
# The AppArmor profile is the only step that needs root, and it needs root
# because Docker takes a profile by *name* and asks the kernel for one already
# loaded -- there is no Docker API that loads a profile, so there is no compose
# directive for it either. Everything else here is a flag.
#
# This service is scripts/vmobs-container's `docker run` expressed in compose;
# tests/deploy/compose_test.go fails if the two drift. Use the script when you
# want the checks it runs first (/dev/kvm, /dev/net/tun, a stale profile) and
# errors that name the one thing to change.

services:
  vmobs:
    container_name: ${VMOBS_CONTAINER_NAME:-vmobs}
    image: ${VMOBS_IMAGE:-vmobs:latest}

    # Built from this checkout when the image is not present. The build needs the
    # guest kernel and root image at images/dist/ -- `scripts/fetch-guest-images`
    # downloads them against runtime.lock.json. A published image already carries
    # them and needs neither the checkout nor the fetch.
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # The script derives this from git; compose cannot, so an unset variable
        # stamps the image "unknown" rather than guessing at a revision.
        SOURCE_REVISION: ${VMOBS_SOURCE_REVISION:-unknown}

    # firecracker is daemonized by the jailer, so every VMM reparents to PID 1.
    # Without a reaper they linger as zombies, and a zombie answers kill(pid, 0) --
    # the runtime's liveness check would call a dead VM alive.
    init: true

    # The API binds loopback (server.mode: loopback_only), so the container's
    # loopback has to be the host's for anyone to reach it.
    network_mode: host

    # docs/design/container-boundary.md §5 exactly: SYS_ADMIN for setns and the
    # jailer's mounts, NET_ADMIN plus /dev/net/tun for tap and veth.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    devices:
      - /dev/kvm
      - /dev/net/tun

    # The other half of §5. AppArmor is a name the kernel must already hold;
    # seccomp is a path compose resolves against this directory and the daemon
    # applies. Both are needed and they cover different calls: seccomp for
    # pivot_root, AppArmor for mount.
    #
    # VMOBS_APPARMOR_PROFILE=unconfined starts on a host that has not loaded the
    # profile. It is not a smaller boundary, it is close to none: this container
    # holds CAP_SYS_ADMIN and a seccomp profile that permits mount, pivot_root,
    # setns and unshare, and AppArmor is the only layer bounding where those
    # mounts can land. §9 asked whether that container is a boundary worth having
    # and answered no. Use it to get a look at the thing, not to run it.
    security_opt:
      - apparmor=${VMOBS_APPARMOR_PROFILE:-vmobs-jailer}
      - seccomp=./deploy/seccomp/vmobs-jailer.json

    # privd binds its socket under /run/vmobs; the image creates that directory in
    # a layer, and the tmpfs keeps the socket out of the image's filesystem.
    tmpfs:
      - /run:mode=0755

    volumes:
      - vmobs-state:/var/lib/vmobs
      - vmobs-runtime:/srv/vmobs

    # A crashed appliance stays down and keeps its logs. Restarting it would
    # reconcile against half-torn-down VMs before anyone had read why it fell over.
    restart: "no"

# Named to match scripts/vmobs-container, so the two start the same appliance and
# `docker volume rm vmobs-state vmobs-runtime` means the same thing either way.
# Without `name:` compose would prefix the project directory onto both.
volumes:
  vmobs-state:
    name: ${VMOBS_STATE_VOLUME:-vmobs-state}
  vmobs-runtime:
    name: ${VMOBS_RUNTIME_VOLUME:-vmobs-runtime}
